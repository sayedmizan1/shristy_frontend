[build]
  publish = "."

[[redirects]]
  from = "/api/*"
  to = "https://shristy-backend.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/media/*"
  to = "https://shristy-backend.onrender.com/media/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200