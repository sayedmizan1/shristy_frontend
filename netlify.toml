[build]
  publish = "."

[[redirects]]
  from = "/api/*"
  to = "https://REPLACE_WITH_YOUR_RENDER_HOST/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/media/*"
  to = "https://REPLACE_WITH_YOUR_RENDER_HOST/media/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200